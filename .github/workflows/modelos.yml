# Regenera js/generado/modelos.js cuando cambian los GLB de assets/modelos (los que salen de kiln), para que
# nadie tenga que acordarse de empaquetarlos (ver herramientas/modelos.py). Si ya estaba al día, no hace nada.
name: Modelos

on:
  push:
    branches: ['**']
    paths: ['assets/modelos/**', 'herramientas/modelos.py', 'js/generado/modelos.js']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modelos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  empaquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Empaquetar los GLB
        run: python3 herramientas/modelos.py
      - name: Subir modelos.js si ha cambiado
        run: |
          git add js/generado/modelos.js
          if git diff --cached --quiet; then echo 'modelos.js ya estaba al día.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenera js/generado/modelos.js a partir de assets/modelos'
          git push
